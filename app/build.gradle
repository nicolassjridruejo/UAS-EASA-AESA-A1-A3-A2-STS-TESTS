plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aulauas.hangar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aulauas.hangar'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '6.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
